name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AlightFixStudio_Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p AlightFixStudio :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AlightFixStudio-APK
          path: AlightFixStudio/app/build/outputs/apk/debug/app-debug.apk
